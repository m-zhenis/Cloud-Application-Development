AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SIS3 - app stack (VPC + ALB + ECS Fargate service).
  Deploy this SECOND, only after you have built and pushed an image
  to the ECR repository created by 01-foundation.yaml.

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: dev
  ImageTag:
    Type: String
    Description: The image tag to deploy (e.g. a git short SHA). Never "latest".

Mappings:
  Sizing:
    dev:     { Cpu: "256", Memory: "512",  Count: 1 }
    staging: { Cpu: "512", Memory: "1024", Count: 2 }
    prod:    { Cpu: "512", Memory: "1024", Count: 2 }

Resources:

  # ---------- Minimal network: 2 public subnets, no NAT gateway ----------
  # Design decision: Fargate tasks get a public IP directly (AssignPublicIp: ENABLED)
  # instead of sitting in private subnets behind a NAT gateway. For a lab-sized service
  # this saves ~$32.85/month per NAT gateway (week 11, slide 23) with no change to
  # what the service can do. Trade-off: tasks are each individually internet-addressable,
  # not just via the ALB - acceptable here because the task security group only allows
  # inbound from the ALB's security group, never from 0.0.0.0/0 directly.

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "sis3-vpc-${Env}" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }
  SubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }

  # ---------- Security groups: ALB open to the world, tasks open only to the ALB ----------

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internet-facing ALB, port 80 open
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: orders-api tasks, only reachable from the ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  # ---------- Load balancer ----------

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "orders-alb-${Env}"
      Scheme: internet-facing
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "orders-tg-${Env}"
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref Vpc
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------- Logs ----------

  ServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/orders-api-${Env}"
      RetentionInDays: 14

  # ---------- The two roles (week 10's requirement, read literally) ----------
  # ExecutionRole: what AWS itself needs to do to START the task (pull the image,
  #                write to CloudWatch). The container never sees these permissions.
  # TaskRole:      what the APPLICATION CODE inside the container is allowed to call.
  #                Here: publish to the order-events SNS topic, nothing else.

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "orders-exec-role-${Env}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "orders-task-role-${Env}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: publish-order-events
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !ImportValue
                  Fn::Sub: "${Env}-order-events-topic-arn"

  # ---------- Task definition + service ----------

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "orders-api-${Env}"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !FindInMap [Sizing, !Ref Env, Cpu]
      Memory: !FindInMap [Sizing, !Ref Env, Memory]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: orders-api
          Image: !Sub
            - "${AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${RepoName}:${ImageTag}"
            - AccountId: !Ref "AWS::AccountId"
              RepoName: !ImportValue
                Fn::Sub: "${Env}-orders-repo-name"
          PortMappings: [{ ContainerPort: 8080 }]
          Environment:
            - Name: ORDER_TOPIC_ARN
              Value: !ImportValue
                Fn::Sub: "${Env}-order-events-topic-arn"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ServiceLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: orders-api

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: !Sub "orders-api-${Env}"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !FindInMap [Sizing, !Ref Env, Count]
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: orders-api
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "orders-cluster-${Env}"

Outputs:
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
  ServiceName:
    Value: !Ref Service
