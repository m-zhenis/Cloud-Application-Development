AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SIS3 - foundation stack (messaging + data + registry).
  Deploy this FIRST. No ECS/ALB here, so it always deploys cleanly
  even before any Docker image exists.

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: dev
    Description: Environment name. Used to namespace resources and exports.
  AlertEmail:
    Type: String
    Description: Email that receives alarm notifications and budget alerts (Practice 8).
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    Description: Monthly cost budget in USD; alerts at 50 percent and 100 percent.

Resources:

  # ---------- Messaging: SQS queue + DLQ (week 9) ----------

  OrdersDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "orders-dlq-${Env}"
      MessageRetentionPeriod: 1209600   # 14 days, the maximum - gives time to notice and replay

  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "orders-queue-${Env}"
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrdersDLQ.Arn
        maxReceiveCount: 5

  # ---------- Domain event fan-out: SNS -> SQS (week 9) ----------

  OrderEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "order-events-${Env}"
      TracingConfig: Active   # Practice 8: SNS adds itself to the X-Ray trace and passes the trace header on

  OrdersQueueSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrderEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt OrdersQueue.Arn
      RawMessageDelivery: true   # the queue sees the plain JSON, not wrapped in an SNS envelope

  # SNS cannot deliver into a queue it wasn't explicitly allowed to - this is the "every layer gets
  # a vote" rule from week 2 / week 9, applied to SQS: an identity policy alone is not enough,
  # the resource (the queue) needs its own policy naming the SNS topic as an allowed sender.
  OrdersQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref OrdersQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSnsToSend
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt OrdersQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OrderEventsTopic

  # ---------- Idempotency store for the consumer ----------
  # The consumer Lambda uses this table as its "have I already done this?" memory.
  # Dedup key = MessageId (we use the order's own orderId, see consumer code below).

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "orders-idempotency-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: MessageId
          AttributeType: S
      KeySchema:
        - AttributeName: MessageId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ExpiresAt
        Enabled: true

  # ---------- The idempotent consumer (week 9) ----------

  ConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/orders-consumer-${Env}"
      RetentionInDays: 14

  ConsumerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "orders-consumer-role-${Env}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: consumer-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${ConsumerLogGroup.Arn}:*"
              - Sid: ReadQueue
                Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt OrdersQueue.Arn
              - Sid: Idempotency
                Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem]
                Resource: !GetAtt IdempotencyTable.Arn
              - Sid: XRayTracing
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: "*"   # X-Ray write actions do not support resource-level permissions

  ConsumerFunction:
    Type: AWS::Lambda::Function
    DependsOn: ConsumerLogGroup
    Properties:
      FunctionName: !Sub "orders-consumer-${Env}"
      Runtime: python3.13
      Handler: index.handler
      Timeout: 10
      Role: !GetAtt ConsumerFunctionRole.Arn
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          TABLE_NAME: !Ref IdempotencyTable
          ENV_NAME: !Ref Env
      Code:
        ZipFile: |
          import json, os, time
          import boto3
          from botocore.exceptions import ClientError

          dynamodb = boto3.resource("dynamodb")
          table = dynamodb.Table(os.environ["TABLE_NAME"])
          ENV = os.environ.get("ENV_NAME", "dev")

          def log(event, metric=None, **fields):
              # One JSON object per line = structured log (queryable in Logs Insights).
              # If "metric" is given, the line is also in CloudWatch Embedded Metric Format (EMF):
              # CloudWatch turns it into a custom metric OrdersApp/<metric> with dimension Env.
              line = {"event": event, "Env": ENV, **fields}
              if metric:
                  line[metric] = 1
                  line["_aws"] = {
                      "Timestamp": int(time.time() * 1000),
                      "CloudWatchMetrics": [{
                          "Namespace": "OrdersApp",
                          "Dimensions": [["Env"]],
                          "Metrics": [{"Name": metric, "Unit": "Count"}],
                      }],
                  }
              print(json.dumps(line))

          def handler(event, context):
              for record in event["Records"]:
                  body = json.loads(record["body"])
                  # the dedup key: the domain's own orderId if present, else SQS's own MessageId
                  dedup_key = body.get("orderId") or record["messageId"]
                  try:
                      table.put_item(
                          Item={
                              "MessageId": dedup_key,
                              "ProcessedAt": int(time.time()),
                              "ExpiresAt": int(time.time()) + 86400,
                          },
                          ConditionExpression="attribute_not_exists(MessageId)",
                      )
                  except ClientError as e:
                      if e.response["Error"]["Code"] == "ConditionalCheckFailedException":
                          log("DUPLICATE", metric="DuplicatesSkipped", dedup_key=dedup_key)
                          continue
                      raise
                  log("PROCESSED", metric="OrdersProcessed", dedup_key=dedup_key)
              return {"batchItemFailures": []}

  ConsumerEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt OrdersQueue.Arn
      FunctionName: !Ref ConsumerFunction
      BatchSize: 5
      FunctionResponseTypes: [ReportBatchItemFailures]

  # ---------- Observability and cost (week 13, Practice 8) ----------

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "orders-alarms-${Env}"

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlertEmail   # stays "Pending confirmation" until the link in the email is clicked

  # Alarm on a SYMPTOM that matters: any message in the dead-letter queue means an order failed 5 times.
  DlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "orders-dlq-not-empty-${Env}"
      AlarmDescription: A message landed in the dead-letter queue - an order failed all 5 attempts.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt OrdersDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  # Saved Logs Insights query: Lambda latency (p95) over time.
  ConsumerLatencyQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub "orders-consumer-p95-latency-${Env}"
      LogGroupNames: [!Ref ConsumerLogGroup]
      QueryString: |
        filter @type = "REPORT"
        | stats avg(@duration) as avg_ms, pct(@duration, 95) as p95_ms, max(@duration) as max_ms, count(*) as invocations by bin(5m) as t
        | sort t desc

  OrdersDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "orders-${Env}"
      DashboardBody: !Sub |
        {
          "widgets": [
            { "type": "alarm", "x": 0, "y": 0, "width": 24, "height": 3,
              "properties": { "title": "Alarm status", "alarms": ["${DlqDepthAlarm.Arn}"] } },
            { "type": "metric", "x": 0, "y": 3, "width": 12, "height": 6,
              "properties": { "title": "Traffic: orders processed and consumer invocations", "region": "${AWS::Region}", "stat": "Sum", "period": 60, "view": "timeSeries",
                "metrics": [ ["OrdersApp", "OrdersProcessed", "Env", "${Env}"],
                             ["AWS/Lambda", "Invocations", "FunctionName", "${ConsumerFunction}"] ] } },
            { "type": "metric", "x": 12, "y": 3, "width": 12, "height": 6,
              "properties": { "title": "Errors: Lambda errors, duplicates skipped, DLQ depth", "region": "${AWS::Region}", "stat": "Sum", "period": 60, "view": "timeSeries",
                "metrics": [ ["AWS/Lambda", "Errors", "FunctionName", "${ConsumerFunction}"],
                             ["OrdersApp", "DuplicatesSkipped", "Env", "${Env}"],
                             ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${OrdersDLQ.QueueName}"] ] } },
            { "type": "metric", "x": 0, "y": 9, "width": 12, "height": 6,
              "properties": { "title": "Latency: consumer duration p95 (ms)", "region": "${AWS::Region}", "stat": "p95", "period": 60, "view": "timeSeries",
                "metrics": [ ["AWS/Lambda", "Duration", "FunctionName", "${ConsumerFunction}"] ] } },
            { "type": "metric", "x": 12, "y": 9, "width": 12, "height": 6,
              "properties": { "title": "Saturation: queue backlog and age of oldest message", "region": "${AWS::Region}", "stat": "Maximum", "period": 60, "view": "timeSeries",
                "metrics": [ ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${OrdersQueue.QueueName}"],
                             ["AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${OrdersQueue.QueueName}"] ] } }
          ]
        }

  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "orders-monthly-${Env}-${AWS::StackName}"   # the stack name is in the budget name, as the lecture advises
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  # ---------- Container registry (week 10) ----------

  OrdersRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub "orders-api-${Env}"
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 7 days",
                "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 7 },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep only the last 10 tagged images",
                "selection": { "tagStatus": "tagged", "tagPrefixList": ["v", "sha-"], "countType": "imageCountMoreThan", "countNumber": 10 },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  QueueArn:
    Value: !GetAtt OrdersQueue.Arn
    Export: { Name: !Sub "${Env}-orders-queue-arn" }
  QueueUrl:
    Value: !Ref OrdersQueue
    Export: { Name: !Sub "${Env}-orders-queue-url" }
  TopicArn:
    Value: !Ref OrderEventsTopic
    Export: { Name: !Sub "${Env}-order-events-topic-arn" }
  EcrRepoName:
    Value: !Ref OrdersRepo
    Export: { Name: !Sub "${Env}-orders-repo-name" }
  EcrRepoArn:
    Value: !GetAtt OrdersRepo.Arn
    Export: { Name: !Sub "${Env}-orders-repo-arn" }
  IdempotencyTableName:
    Value: !Ref IdempotencyTable
    Export: { Name: !Sub "${Env}-orders-idempotency-table" }
  AlarmTopicArn:
    Value: !Ref AlarmTopic
  DlqUrl:
    Value: !Ref OrdersDLQ
  DashboardName:
    Value: !Ref OrdersDashboard
